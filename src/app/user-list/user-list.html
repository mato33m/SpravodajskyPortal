<h2>Používatelia</h2>

@for (u of users; track u.userId) {
  <div class="user-item">
    <div class="user-avatar">{{ u.firstName.charAt(0) }}{{ u.lastName.charAt(0) }}</div>

    <div class="user-info">
      <div class="user-name">{{ u.firstName }} {{ u.lastName }}</div>
      <div class="user-username">&#64;{{ u.username }}</div>
    </div>


    <div class="user-actions">
      <select class="role-select" [value]="u.role" (change)="onRoleChange(u.userId, $any($event.target).value)">
        <option value="USER">USER</option>
        <option value="EDITOR">EDITOR</option>
        <option value="ADMIN">ADMIN</option>
      </select>

      @if (u.banned) {
        <button class="btn-unban" (click)="onUnban(u.userId)">Unban</button>
      } @else {
        <button class="btn-ban" (click)="onBan(u.userId)">Ban</button>
      }

      <button class="btn-delete" (click)="onDelete(u.userId)">Zmazať</button>
    </div>
  </div>
}
